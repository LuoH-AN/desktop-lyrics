<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>
  /* ===================================================================
     桌面歌词 · 主页（Apple Music 风格灵动歌词）
     - 放大高亮 / 弹簧滚动 / 景深模糊 / 逐字点亮 / 呼吸浮动 / 间奏三点
     - 黑白灰扁平配色，纯边框，无阴影
     - 亮/暗主题：html[data-theme=light|dark]
     - 由原生通过 window.LyricHome API 驱动；浏览器直开时用内置 demo
     =================================================================== */
  :root {
    --bg:#0a0a0b;
    --lyric-past:rgba(255,255,255,.26);
    --lyric-cur:#ffffff;
    --sung:#ffffff;
    --unsung:rgba(255,255,255,.30);
    --bar-line:rgba(255,255,255,.12);
    --cover-bg:#1a1a1e;
    --cover-line:rgba(255,255,255,.14);
    --song:#ffffff;
    --singer:rgba(255,255,255,.5);
    --dots:rgba(255,255,255,.55);
    --prog-track:rgba(255,255,255,.16);
    --prog-fill:#ffffff;
    --time:rgba(255,255,255,.45);
    --sheet-bg:#151517;
    --sheet-line:rgba(255,255,255,.10);
    --sheet-text:#ffffff;
    --sheet-sub:rgba(255,255,255,.5);
    --accent:#e8590c;
  }
  html[data-theme="light"] {
    --bg:#fbfbfa;
    --lyric-past:rgba(0,0,0,.24);
    --lyric-cur:#111113;
    --sung:#111113;
    --unsung:rgba(0,0,0,.26);
    --bar-line:rgba(0,0,0,.10);
    --cover-bg:#eeeeec;
    --cover-line:rgba(0,0,0,.12);
    --song:#111113;
    --singer:rgba(0,0,0,.45);
    --dots:rgba(0,0,0,.5);
    --prog-track:rgba(0,0,0,.12);
    --prog-fill:#111113;
    --time:rgba(0,0,0,.4);
    --sheet-bg:#ffffff;
    --sheet-line:rgba(0,0,0,.09);
    --sheet-text:#111113;
    --sheet-sub:rgba(0,0,0,.45);
    --accent:#e8590c;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden; background:var(--bg);
    font-family:-apple-system,"SF Pro Display","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
    transition:background-color .4s ease;
  }
  body { display:flex; flex-direction:column; }

  /* ---------- 歌词滚动区 ---------- */
  #stage {
    flex:1; position:relative; overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 82%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 82%,transparent 100%);
  }
  #track {
    position:absolute; left:0; right:0; padding:0 26px;
    transition:transform .78s cubic-bezier(.16,.84,.28,1);
  }
  .line {
    padding:11px 0; cursor:pointer;
    color:var(--lyric-past);
    font-size:27px;
    font-weight:700; letter-spacing:-.5px; line-height:1.32;
    transform-origin:left center;
    overflow-wrap:break-word; word-break:break-word;
    transition:color .55s ease, filter .7s ease, opacity .7s ease,
               transform .72s cubic-bezier(.34,1.32,.42,1);
  }
  .line .sub {
    display:block; font-size:.6em; font-weight:600; margin-top:5px;
    opacity:.72; letter-spacing:0;
  }
  .line[data-d="0"] { color:var(--lyric-cur); filter:none;        opacity:1;   transform:scale(1); }
  .line[data-d="1"] {                          filter:blur(.5px);  opacity:.8;  transform:scale(.85); }
  .line[data-d="2"] {                          filter:blur(1.4px); opacity:.58; transform:scale(.82); }
  .line[data-d="3"] {                          filter:blur(2.6px); opacity:.4;  transform:scale(.8); }
  .line[data-d="4"] {                          filter:blur(4px);   opacity:.25; transform:scale(.785); }

  .line[data-d="0"] { animation:breathe 4.6s ease-in-out infinite; animation-delay:.85s; }
  @keyframes breathe {
    0%,100% { opacity:1; }
    50%     { opacity:.88; }
  }

  .line .word { color:var(--unsung); transition:color .12s linear; }
  .line .word.on { color:var(--sung); }
  .line[data-d="0"] .karaoke {
    --wipe:0%;
    background:linear-gradient(90deg,
      var(--sung) 0%,
      var(--sung) calc(var(--wipe) - 4%),
      var(--unsung) calc(var(--wipe) + 4%),
      var(--unsung) 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }

  #interlude {
    display:none; position:absolute; left:26px; gap:11px; align-items:center;
    pointer-events:none;
  }
  #interlude.show { display:flex; }
  #interlude i {
    width:12px; height:12px; border-radius:50%; background:var(--lyric-cur);
    opacity:.28; transform:scale(.8);
    transition:opacity .25s ease, transform .25s ease;
  }
  #interlude i.lit { opacity:1; transform:scale(1.15); }

  /* 空状态：文案 + 添加 LRC 歌词按钮 */
  .empty {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    color:var(--lyric-past); font-size:19px; font-weight:600; text-align:center; padding:0 40px;
  }
  .empty.show { display:flex; }
  .empty-add {
    display:none; font-size:14px; font-weight:600; letter-spacing:.3px;
    color:var(--song); padding:9px 18px; border-radius:22px;
    border:1px solid var(--bar-line); cursor:pointer;
    transition:opacity .15s ease;
  }
  .empty-add:active { opacity:.5; }
  .empty.offer-add .empty-add { display:inline-block; }

  /* ---------- 底部播放条 ---------- */
  #bar {
    flex-shrink:0; padding:16px 22px calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid var(--bar-line);
  }
  #barTop { display:flex; align-items:center; gap:13px; }
  #cover {
    width:50px; height:50px; border-radius:11px; flex-shrink:0;
    background:var(--cover-bg); border:1px solid var(--cover-line);
    background-size:cover; background-position:center;
  }
  #meta { min-width:0; flex:1; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #metaText { min-width:0; }
  #song { font-size:16px; font-weight:700; letter-spacing:-.3px; color:var(--song);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .4s ease; }
  #singer { font-size:13px; font-weight:500; margin-top:2px; color:var(--singer);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .4s ease; }
  #more {
    flex-shrink:0; width:36px; height:34px; margin-right:-8px;
    display:flex; align-items:center; justify-content:center;
    color:var(--dots); font-size:22px; line-height:1; letter-spacing:1px; cursor:pointer;
    transition:opacity .15s ease;
  }
  #more:active { opacity:.4; }

  #progWrap { margin-top:14px; cursor:pointer; padding:7px 0; touch-action:none; }
  #progTrack { height:3px; border-radius:2px; background:var(--prog-track); position:relative; transition:height .18s ease; }
  #progWrap.drag #progTrack { height:5px; }
  #progFill { position:absolute; left:0; top:0; height:100%; width:0%; border-radius:2px; background:var(--prog-fill); }
  #progKnob {
    position:absolute; top:50%; left:0; width:12px; height:12px; border-radius:50%;
    background:var(--prog-fill); transform:translate(-50%,-50%) scale(0);
    transition:transform .18s ease;
  }
  #progWrap.drag #progKnob, #progWrap:active #progKnob { transform:translate(-50%,-50%) scale(1); }
  #time { display:flex; justify-content:space-between; margin-top:8px; color:var(--time);
    font-size:12px; font-weight:500; font-variant-numeric:tabular-nums; }

  #controls { display:flex; align-items:center; justify-content:center; gap:34px; margin-top:14px; }
  .ctrl {
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--song); transition:transform .12s ease, opacity .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .ctrl:active { transform:scale(.86); opacity:.6; }
  .ctrl.disabled { opacity:.28; pointer-events:none; }
  .ctrl svg { display:block; fill:currentColor; }
  #btnPrev svg, #btnNext svg { width:30px; height:30px; }
  #btnPlay {
    width:56px; height:56px; border-radius:50%;
    border:1px solid var(--bar-line);
  }
  #btnPlay svg { width:26px; height:26px; }

  /* ---------- ⋯ 动作菜单（底部弹出） ---------- */
  #sheetMask {
    position:fixed; inset:0; background:rgba(0,0,0,.42);
    opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:40;
  }
  #sheetMask.show { opacity:1; pointer-events:auto; }
  #sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    background:var(--sheet-bg); border-top:1px solid var(--sheet-line);
    border-radius:16px 16px 0 0;
    padding:8px 0 calc(10px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .26s cubic-bezier(.22,.9,.32,1);
  }
  #sheetMask.show #sheet { transform:translateY(0); }
  .sheet-item {
    padding:15px 24px; font-size:16px; font-weight:600; color:var(--sheet-text);
    cursor:pointer; transition:opacity .12s ease;
  }
  .sheet-item:active { opacity:.5; }
  .sheet-item .desc { display:block; font-size:12px; font-weight:500; color:var(--sheet-sub); margin-top:3px; }
  .sheet-sep { height:1px; background:var(--sheet-line); margin:4px 0; }
  .sheet-cancel { color:var(--sheet-sub); }
</style>
</head>
<body>
  <div id="stage">
    <div id="track"></div>
    <div id="interlude"><i></i><i></i><i></i></div>
    <div class="empty show" id="empty">
      <span id="emptyText">正在获取歌词…</span>
      <span class="empty-add" id="emptyAdd">添加 LRC 歌词</span>
    </div>
  </div>

  <div id="bar">
    <div id="barTop">
      <div id="cover"></div>
      <div id="meta">
        <div id="metaText">
          <div id="song">未在播放</div>
          <div id="singer"></div>
        </div>
        <div id="more" title="更多">⋯</div>
      </div>
    </div>
    <div id="progWrap"><div id="progTrack"><div id="progFill"></div><div id="progKnob"></div></div></div>
    <div id="time"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div id="controls">
      <div class="ctrl" id="btnPrev" title="上一首">
        <svg viewBox="0 0 24 24"><path d="M7 6v12H5V6h2zm12 0v12l-8.5-6L19 6z"/></svg>
      </div>
      <div class="ctrl" id="btnPlay" title="播放/暂停">
        <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </div>
      <div class="ctrl" id="btnNext" title="下一首">
        <svg viewBox="0 0 24 24"><path d="M17 6v12h2V6h-2zM5 6v12l8.5-6L5 6z"/></svg>
      </div>
    </div>
  </div>

  <!-- ⋯ 动作菜单 -->
  <div id="sheetMask">
    <div id="sheet">
      <div class="sheet-item" id="actCustom">
        <span id="actCustomTitle">为这首歌指定 LRC 歌词</span>
        <span class="desc" id="actCustomDesc">获取不到歌词时，手动粘贴标准 LRC 时间轴</span>
      </div>
      <div class="sheet-item" id="actManage">管理自定义歌词<span class="desc">查看、编辑、删除已保存的歌词</span></div>
      <div class="sheet-sep"></div>
      <div class="sheet-item" id="actSettings">设置</div>
      <div class="sheet-item sheet-cancel" id="actCancel">取消</div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var stage = document.getElementById('stage');
  var trackEl = document.getElementById('track');
  var interlude = document.getElementById('interlude');
  var emptyEl = document.getElementById('empty');
  var emptyText = document.getElementById('emptyText');
  var emptyAdd = document.getElementById('emptyAdd');
  var coverEl = document.getElementById('cover');
  var songEl = document.getElementById('song');
  var singerEl = document.getElementById('singer');
  var moreEl = document.getElementById('more');
  var progWrap = document.getElementById('progWrap');
  var progFill = document.getElementById('progFill');
  var tCur = document.getElementById('tCur');
  var tDur = document.getElementById('tDur');
  var progKnob = document.getElementById('progKnob');
  var btnPrev = document.getElementById('btnPrev');
  var btnPlay = document.getElementById('btnPlay');
  var btnNext = document.getElementById('btnNext');
  var iconPlay = document.getElementById('iconPlay');
  var iconPause = document.getElementById('iconPause');
  var sheetMask = document.getElementById('sheetMask');
  var actCustom = document.getElementById('actCustom');
  var actCustomTitle = document.getElementById('actCustomTitle');
  var actCustomDesc = document.getElementById('actCustomDesc');
  var actManage = document.getElementById('actManage');
  var actSettings = document.getElementById('actSettings');
  var actCancel = document.getElementById('actCancel');

  var lines = [];          // [{time, text, sub, words:[{t,dur,word}], endTime}]
  var lineEls = [];
  var activeIdx = -1;
  var durationMs = 0;
  var positionMs = 0;
  var lastSyncWall = 0;
  var smoothPos = null;
  var playing = false;
  var active = true;       // 页面是否在前台（onPause 用 setActive(false) 停 rAF）
  var rafId = 0;
  // 翻译模式：'bilingual' | 'original' | 'translated'
  var translationMode = 'bilingual';
  var lyricOffsetMs = 0;
  var isCustom = false;    // 当前显示的是不是用户自定义歌词
  var canPrev = false, canNext = false;
  var dragging = false;
  var hasTrack = false;    // 当前有没有正在播放的歌（决定空状态是否提供“添加 LRC”）

  function fmt(ms){
    if(!isFinite(ms)||ms<0)ms=0;
    var s = Math.floor(ms/1000);
    var m = Math.floor(s/60);
    s = s%60;
    return m + ':' + (s<10?'0':'') + s;
  }

  // ---- 原生调用入口 ----
  function bridge(name){ try{ return window.LyricHomeNative && window.LyricHomeNative[name]; }catch(e){ return null; } }
  function callNative(name){ var f=bridge(name); if(f){ var a=Array.prototype.slice.call(arguments,1); try{ window.LyricHomeNative[name].apply(window.LyricHomeNative,a); }catch(e){} return true; } return false; }

  // ---------- ⋯ 动作菜单 ----------
  function openSheet(){
    // 根据当前是否已有自定义歌词，调整第一项文案
    if(isCustom){
      actCustomTitle.textContent = '编辑这首歌的自定义歌词';
      actCustomDesc.textContent = '修改或删除当前这份手动指定的歌词';
    } else {
      actCustomTitle.textContent = hasTrack ? '为这首歌指定 LRC 歌词' : '添加自定义 LRC 歌词';
      actCustomDesc.textContent = '获取不到歌词时，手动粘贴标准 LRC 时间轴';
    }
    sheetMask.classList.add('show');
  }
  function closeSheet(){ sheetMask.classList.remove('show'); }
  moreEl.addEventListener('click', function(){
    if(bridge('openMore') || bridge('editCustomLyrics')) openSheet();
    else alert('（demo）打开设置 / 更多菜单');
  });
  sheetMask.addEventListener('click', function(e){ if(e.target===sheetMask) closeSheet(); });
  actCustom.addEventListener('click', function(){ closeSheet(); callNative('editCustomLyrics'); });
  actManage.addEventListener('click', function(){ closeSheet(); callNative('manageCustomLyrics'); });
  actSettings.addEventListener('click', function(){ closeSheet(); callNative('openMore'); });
  actCancel.addEventListener('click', closeSheet);
  emptyAdd.addEventListener('click', function(){ callNative('editCustomLyrics'); });

  // ---------- 传输控制 ----------
  btnPlay.addEventListener('click', function(){
    playing = !playing; renderPlayIcon();
    if(!callNative('togglePlay')){ /* demo */ }
  });
  btnPrev.addEventListener('click', function(){ if(btnPrev.classList.contains('disabled'))return; callNative('skipPrev'); });
  btnNext.addEventListener('click', function(){ if(btnNext.classList.contains('disabled'))return; callNative('skipNext'); });

  function renderPlayIcon(){
    iconPlay.style.display  = playing ? 'none' : 'block';
    iconPause.style.display = playing ? 'block' : 'none';
  }
  function renderTransport(){
    btnPrev.classList.toggle('disabled', !canPrev);
    btnNext.classList.toggle('disabled', !canNext);
    renderPlayIcon();
  }

  // ---------- 进度条：点击 + 拖动 ----------
  function ratioFromEvent(clientX){
    var rect = progWrap.getBoundingClientRect();
    return Math.min(1, Math.max(0, (clientX-rect.left)/rect.width));
  }
  function previewSeek(ratio){
    var pos = ratio*durationMs;
    progFill.style.width = (ratio*100)+'%';
    progKnob.style.left = (ratio*100)+'%';
    tCur.textContent = fmt(pos);
  }
  function pointerDown(ev){
    if(durationMs<=0) return;
    dragging = true; progWrap.classList.add('drag');
    var x = ev.touches? ev.touches[0].clientX : ev.clientX;
    previewSeek(ratioFromEvent(x));
    ev.preventDefault();
  }
  function pointerMove(ev){
    if(!dragging) return;
    var x = ev.touches? ev.touches[0].clientX : ev.clientX;
    previewSeek(ratioFromEvent(x));
    ev.preventDefault();
  }
  function pointerUp(ev){
    if(!dragging) return;
    dragging = false; progWrap.classList.remove('drag');
    var x = (ev.changedTouches? ev.changedTouches[0].clientX : ev.clientX);
    var ratio = ratioFromEvent(x);
    var target = ratio*durationMs;
    callNative('seekTo', target);
    setPosition(target, playing);
  }
  progWrap.addEventListener('mousedown', pointerDown);
  progWrap.addEventListener('touchstart', pointerDown, {passive:false});
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('touchmove', pointerMove, {passive:false});
  window.addEventListener('mouseup', pointerUp);
  window.addEventListener('touchend', pointerUp);

  // 点击某行 → seek 到该行时间（考虑偏移：显示位置 = 播放位置 + offset，故回跳要减 offset）
  function onLineClick(idx){
    var ln = lines[idx];
    if(!ln || ln.time==null) return;
    var target = Math.max(0, ln.time - lyricOffsetMs);
    callNative('seekTo', target);
    setPosition(target, playing);
  }

  // ---------- 渲染歌词行 ----------
  function renderLines(){
    trackEl.innerHTML = '';
    lineEls = [];
    lines.forEach(function(ln, i){
      var el = document.createElement('div');
      el.className = 'line';
      el.setAttribute('data-d','4');
      // 逐字仅在非“纯译文”模式下用
      var useWords = translationMode!=='translated' && ln.words && ln.words.length;
      var primary = (translationMode==='translated' && ln.sub) ? ln.sub : ln.text;
      if(useWords){
        var span = document.createElement('span');
        span.className = 'karaoke';
        span.textContent = ln.text;
        el.appendChild(span);
        el._karaoke = span;
      } else {
        el.appendChild(document.createTextNode(primary || ''));
      }
      // 双语模式才显示译文副行
      if(translationMode==='bilingual' && ln.sub){
        var sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = ln.sub;
        el.appendChild(sub);
      }
      el.addEventListener('click', function(){ onLineClick(i); });
      trackEl.appendChild(el);
      lineEls.push(el);
    });
    activeIdx = -1;
  }

  // ---------- 找当前行 ----------
  function currentLineIndex(pos){
    if(!lines.length) return -1;
    var lo=0, hi=lines.length-1, ans=-1;
    while(lo<=hi){
      var mid=(lo+hi)>>1;
      if(lines[mid].time<=pos){ ans=mid; lo=mid+1; }
      else hi=mid-1;
    }
    return ans;
  }

  // 一句的结束时间：优先 endTime，否则据字数估算（3~8s），供间奏判断
  function lineEnd(idx){
    var ln = lines[idx];
    if(!ln) return 0;
    if(ln.endTime && ln.endTime>ln.time) return ln.endTime;
    var chars = (ln.text||'').length;
    return ln.time + Math.min(8000, Math.max(3000, chars*400+1500));
  }

  // ---------- 主循环：滚动 + 距离态 + 逐字 + 间奏 ----------
  function estimatedPos(){
    var raw = playing ? positionMs + (performance.now()-lastSyncWall) : positionMs;
    raw += lyricOffsetMs;   // 歌词偏移：正=歌词提前
    if(smoothPos==null){ smoothPos = raw; }
    else {
      var diff = raw - smoothPos;
      if(diff < 0 && diff > -1200){
        smoothPos += diff * 0.18;
      } else {
        smoothPos = raw;
      }
    }
    return smoothPos;
  }

  function layout(pos){
    if(!lines.length) return;
    var idx = currentLineIndex(pos);

    // 间奏检测
    var inInterlude = false, gapStart=0, gapEnd=0;
    if(idx>=0){
      var nextT = (idx+1<lines.length)? lines[idx+1].time : durationMs;
      var curEnd = lineEnd(idx);
      var gap = nextT - curEnd;
      if(gap>4500 && pos > curEnd+300 && pos < nextT-250){
        inInterlude=true; gapStart=curEnd; gapEnd=nextT;
      }
    } else {
      if(lines.length && lines[0].time>4000 && pos < lines[0].time-250){
        inInterlude=true; gapStart=0; gapEnd=lines[0].time;
      }
    }

    if(activeIdx!==idx){
      activeIdx = idx;
      lineEls.forEach(function(el,i){
        var dist = Math.abs(i-idx);
        var d = Math.min(4, dist);
        if(idx<0) d = Math.min(4, i+1);
        var delay = Math.min(dist,5) * 42;
        el.style.transitionDelay = delay + 'ms';
        el.setAttribute('data-d', String(d));
      });
      var anchor = (idx>=0)? lineEls[idx] : (lineEls[0]||null);
      if(anchor){
        var target = stage.clientHeight*0.42 - anchor.offsetTop - anchor.offsetHeight/2;
        trackY = target;
        trackEl.style.transform = 'translateY('+target+'px)';
      }
    }

    // 逐字点亮
    if(idx>=0){
      var ln = lines[idx];
      var el = lineEls[idx];
      if(ln.words && ln.words.length && el && el._karaoke){
        var ws = ln.words;
        var total = 0;
        for(var wi=0; wi<ws.length; wi++){ total += (ws[wi].word||'').length; }
        total = Math.max(1, total);
        var doneChars = 0, frac = 0;
        var acc = 0, curW = -1;
        for(var wj=0; wj<ws.length; wj++){
          var w = ws[wj];
          var wStart = w.t;
          var wEnd = w.t + (w.dur|| (wj+1<ws.length? ws[wj+1].t-w.t : 500));
          if(pos < wStart){ curW = wj; frac = 0; break; }
          if(pos <= wEnd){ curW = wj; frac = (pos-wStart)/Math.max(1,(wEnd-wStart)); break; }
          acc += (w.word||'').length;
        }
        if(curW === -1){ doneChars = total; }
        else { doneChars = acc + (ws[curW].word||'').length * Math.min(1,Math.max(0,frac)); }
        var wipe = Math.min(100, Math.max(0, doneChars/total*100));
        el._karaoke.style.setProperty('--wipe', wipe.toFixed(2)+'%');
      }
    }

    // 间奏三点：定位在当前行下方，跟着歌词一起走
    if(inInterlude){
      interlude.classList.add('show');
      var anchorIdx = idx>=0?idx:0;
      var anchorEl = lineEls[anchorIdx];
      if(anchorEl){
        var ty = trackY + anchorEl.offsetTop + anchorEl.offsetHeight + 8;
        interlude.style.top = ty + 'px';
      }
      var ratio = (pos-gapStart)/(gapEnd-gapStart);
      var dots = interlude.children;
      for(var k=0;k<3;k++){
        dots[k].classList.toggle('lit', ratio > (k+0.5)/3);
      }
    } else {
      interlude.classList.remove('show');
    }
  }
  var trackY = 0;

  function tick(){
    if(!active) return;
    layout(estimatedPos());
    rafId = requestAnimationFrame(tick);
  }
  function startTick(){ if(!rafId){ rafId = requestAnimationFrame(tick); } }
  function stopTick(){ if(rafId){ cancelAnimationFrame(rafId); rafId = 0; } }

  // ---------- 进度条 + 时间 ----------
  function paintProgress(pos){
    if(dragging) return;
    var ratio = durationMs>0? Math.min(1,pos/durationMs) : 0;
    progFill.style.width = (ratio*100)+'%';
    progKnob.style.left = (ratio*100)+'%';
    tCur.textContent = fmt(pos);
    tDur.textContent = fmt(durationMs);
  }
  var progTimer = setInterval(function(){ if(active) paintProgress(playing? positionMs+(performance.now()-lastSyncWall) : positionMs); }, 250);

  function setPosition(pos, isPlaying, smooth){
    positionMs = pos; playing = !!isPlaying; lastSyncWall = performance.now();
    if(!smooth) smoothPos = pos + lyricOffsetMs;
    renderPlayIcon();
    paintProgress(pos);
  }

  function showEmpty(text, offerAdd){
    emptyText.textContent = text;
    emptyEl.classList.add('show');
    emptyEl.classList.toggle('offer-add', !!offerAdd);
  }
  function hideEmpty(){ emptyEl.classList.remove('show','offer-add'); }

  // ===================================================================
  //  公开 API（原生调用）
  // ===================================================================
  window.LyricHome = {
    setTheme: function(t){ document.documentElement.setAttribute('data-theme', t==='light'?'light':'dark'); },

    // 前台/后台切换：后台时停 rAF 释放 CPU（替代进程级 pauseTimers）
    setActive: function(on){
      active = !!on;
      if(active){ lastSyncWall = performance.now(); startTick(); }
      else { stopTick(); }
    },

    setSnapshot: function(s){
      if(typeof s==='string'){ try{ s=JSON.parse(s); }catch(e){ return; } }
      hasTrack = !!(s.track);
      songEl.textContent = s.track || '未在播放';
      // 自定义歌词时在歌手行标注
      var singer = s.artist || '';
      singerEl.textContent = isCustom ? (singer? singer+' · 自定义歌词' : '自定义歌词') : singer;
      if(s.cover){ coverEl.style.backgroundImage='url("'+s.cover+'")'; }
      else { coverEl.style.backgroundImage=''; }
      durationMs = s.durationMs||0;
      canPrev = !!s.canPrev; canNext = !!s.canNext;
      setPosition(s.positionMs||0, s.state==='playing');
      renderTransport();
      if(!lines.length){ showEmpty(s.track? '正在获取歌词…' : '未在播放', false); }
    },

    setProgress: function(posMs, isPlaying){ setPosition(posMs, isPlaying, true); },

    // 翻译模式：'bilingual' | 'original' | 'translated'
    setTranslationMode: function(mode){
      translationMode = (mode==='original'||mode==='translated')? mode : 'bilingual';
      if(lines.length) renderLines();
    },

    // 歌词偏移（毫秒，正=歌词提前）
    setLyricOffset: function(ms){
      lyricOffsetMs = Number(ms)||0;
      smoothPos = null; // 让下一帧重新对齐
    },

    setLyrics: function(data){
      if(typeof data==='string'){ try{ data=JSON.parse(data); }catch(e){ return; } }
      lines = Array.isArray(data)? data : (data.lines||[]);
      lines.sort(function(a,b){ return (a.time||0)-(b.time||0); });
      if(lines.length){ hideEmpty(); renderLines(); activeIdx=-1; }
      else {
        trackEl.innerHTML='';
        // 无歌词：有正在播放的歌就提供“添加 LRC 歌词”入口
        showEmpty(hasTrack? '暂未匹配到歌词' : '未在播放', hasTrack && !!bridge('editCustomLyrics'));
      }
    },

    // 直接喂 LRC 文本
    //   lrc / translated / wordLrc 与 DirectLyricsRepository / CustomLyricsStore 输出一致
    //   source: 来源名（可空），custom: 是否用户自定义歌词
    setLyricsFromLrc: function(lrc, translated, wordLrc, source, custom){
      isCustom = !!custom;
      var parsed = parseLrc(lrc||'');
      var trans = parseLrc(translated||'');
      var words = parseWordLrc(wordLrc||'');
      if(trans.length){
        var tmap = {};
        trans.forEach(function(t){ tmap[Math.round(t.time/10)] = t.text; });
        parsed.forEach(function(p){
          var k = Math.round(p.time/10);
          if(tmap[k]) p.sub = tmap[k];
        });
      }
      // 逐字：仅当逐字轨覆盖 ≥70% 的行时才启用（否则退回逐行）
      if(words.length){
        var attached = 0;
        words.forEach(function(wl){
          var best=null, bestDiff=1e9;
          for(var i=0;i<parsed.length;i++){
            var d=Math.abs(parsed[i].time - wl.time);
            if(d<bestDiff){ bestDiff=d; best=parsed[i]; }
          }
          if(best && bestDiff<1200){ best.words = wl.words; best.endTime = wl.endTime; attached++; }
        });
        if(parsed.length && attached/parsed.length < 0.7){
          // 覆盖率不足，去掉零散逐字，统一逐行
          parsed.forEach(function(p){ delete p.words; });
        }
      }
      // 更新歌手行的自定义标注（此时可能歌手已显示）
      if(isCustom && hasTrack){
        var singer = singerEl.textContent.replace(/ · 自定义歌词$/, '');
        singerEl.textContent = singer? singer+' · 自定义歌词' : '自定义歌词';
      }
      window.LyricHome.setLyrics(parsed);
    },

    clear: function(){
      lines=[]; lineEls=[]; trackEl.innerHTML=''; isCustom=false;
      showEmpty(hasTrack? '正在获取歌词…' : '未在播放', false);
    }
  };

  // ---------- LRC / QRC 解析 ----------
  // 支持 3 位分钟；空文本时间戳保留为 endTime 标记（用于间奏/一句结束判断）
  function parseLrc(text){
    var out=[];
    if(!text) return out;
    var rows=text.split(/\r?\n/);
    var re=/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
    var credit=/^(作词|作曲|编曲|制作人|混音|母带|录音|和声|监制|出品|发行|词|曲)\s*[：:]/i;
    var stampsAll=[];
    rows.forEach(function(row){
      var stamps=[], m; re.lastIndex=0;
      while((m=re.exec(row))!==null){
        var mm=+m[1], ss=+m[2], frac=m[3]?m[3]:'0';
        var ms = mm*60000 + ss*1000 + Math.round(parseFloat('0.'+frac)*1000);
        stamps.push(ms);
      }
      if(!stamps.length) return;
      var txt=row.replace(re,'').trim();
      stamps.forEach(function(t){ stampsAll.push({time:t, text:txt}); });
    });
    stampsAll.sort(function(a,b){ return a.time-b.time; });
    // 生成行：空文本作为上一句的 endTime
    for(var i=0;i<stampsAll.length;i++){
      var s = stampsAll[i];
      if(!s.text){
        if(out.length && !out[out.length-1].endTime){ out[out.length-1].endTime = s.time; }
        continue;
      }
      if(credit.test(s.text)) continue;
      out.push({time:s.time, text:s.text});
    }
    return out;
  }

  // QRC 逐字：行头 [start,dur] 后跟 文字(start,dur[,0]) 序列
  function parseWordLrc(text){
    var out=[];
    if(!text) return out;
    var rows=text.split(/\r?\n/);
    var lineRe=/^\[(\d+),(\d+)\]/;
    rows.forEach(function(row){
      var lm=row.match(lineRe);
      if(!lm) return;
      var lineStart=+lm[1], lineDur=+lm[2];
      var body=row.slice(lm[0].length);
      var matcher=/\((\d+),(\d+)(?:,\d+)?\)/g;
      var tokens=[], match;
      while((match=matcher.exec(body))!==null){
        tokens.push({start:+match[1],dur:+match[2],textStart:matcher.lastIndex,markerStart:match.index});
      }
      var words=[], txt='';
      tokens.forEach(function(token,index){
        var w=body.slice(token.textStart, index+1<tokens.length?tokens[index+1].markerStart:body.length);
        if(w){ words.push({t:token.start, dur:token.dur, word:w}); txt+=w; }
      });
      if(!words.length) return;
      out.push({time:lineStart, endTime:lineStart+lineDur, text:txt, words:words});
    });
    return out.sort(function(a,b){ return a.time-b.time; });
  }

  startTick();

  // ===================================================================
  //  浏览器 demo（无原生时自动跑一段，方便预览）
  // ===================================================================
  if(!bridge('openMore') && !bridge('editCustomLyrics')){
    document.documentElement.setAttribute('data-theme','dark');
    var demo = [
      {time:0,    text:'窗外的麻雀 在电线杆上多嘴'},
      {time:3200, text:'你说这一句 很有夏天的感觉'},
      {time:6800, text:'阳光洒在 走过的青石板街'},
      {time:10200, text:'教室前 漫长的台阶', sub:'The long steps before the classroom',
        words:[{t:10200,dur:500,word:'教'},{t:10700,dur:500,word:'室'},{t:11200,dur:600,word:'前'},
               {t:12000,dur:400,word:'漫'},{t:12400,dur:400,word:'长'},{t:12800,dur:300,word:'的'},
               {t:13100,dur:500,word:'台'},{t:13600,dur:900,word:'阶'}], endTime:14500},
      {time:15000, text:'我踮起脚尖 靠近你一点'},
      {time:18600, text:'风扬起 你发梢的思念'},
      {time:22200, text:'整个夏天 都是你的侧脸'},
      {time:26000, text:'时光在这里 停格成永远'}
    ];
    window.LyricHome.setSnapshot({track:'一千零一夜',artist:'黄霄雲',durationMs:197000,positionMs:10200,state:'playing',canPrev:true,canNext:true});
    window.LyricHome.setLyrics(demo);
    var base = performance.now(), start=10200;
    setInterval(function(){
      var p = start + (performance.now()-base);
      if(p>30000){ base=performance.now(); }
      window.LyricHome.setProgress(p, true);
    }, 200);
  }
})();
</script>
